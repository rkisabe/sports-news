<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本プロスポーツニュースポータル</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 1.1em;
        }

        .update-info {
            text-align: center;
            margin-top: 15px;
            color: #888;
            font-size: 0.9em;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: white;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .tab-button {
            flex: 1;
            padding: 15px 25px;
            border: none;
            background: #f0f0f0;
            color: #333;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .tab-button:hover {
            background: #e0e0e0;
            transform: translateY(-2px);
        }

        .tab-button.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .news-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .news-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .team-badge {
            display: inline-block;
            padding: 5px 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .news-title {
            font-size: 1.1em;
            color: #333;
            margin-bottom: 10px;
            line-height: 1.5;
            font-weight: 600;
        }

        .news-meta {
            color: #888;
            font-size: 0.85em;
            margin-top: 10px;
        }

        .news-summary {
            color: #666;
            font-size: 0.9em;
            margin-top: 10px;
            line-height: 1.6;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: white;
            font-size: 1.5em;
        }

        .no-news {
            text-align: center;
            padding: 50px;
            background: white;
            border-radius: 12px;
            color: #666;
        }

        .league-label {
            display: inline-block;
            padding: 3px 8px;
            background: #f0f0f0;
            border-radius: 4px;
            font-size: 0.75em;
            margin-right: 5px;
            color: #666;
        }

        @media (max-width: 768px) {
            .news-grid {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 1.8em;
            }
            
            .tabs {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚾🏃⛹️ 日本プロスポーツニュースポータル</h1>
            <p class="subtitle">NPB・Jリーグ・Bリーグの最新情報を一括チェック</p>
            <p class="update-info" id="updateInfo">データ読み込み中...</p>
        </header>

        <div class="tabs">
            <button class="tab-button active" onclick="showTab('all')">すべて</button>
            <button class="tab-button" onclick="showTab('npb')">⚾ NPB</button>
            <button class="tab-button" onclick="showTab('jleague')">⚽ Jリーグ</button>
            <button class="tab-button" onclick="showTab('bleague')">🏀 Bリーグ</button>
        </div>

        <div id="newsContainer">
            <div class="loading">ニュースを読み込んでいます...</div>
        </div>
    </div>

    <script>
        let newsData = null;
        let currentTab = 'all';

        // ニュースデータを読み込む
        async function loadNews() {
            try {
                const response = await fetch('news_data.json');
                newsData = await response.json();
                
                // 更新時刻を表示
                const updateTime = new Date(newsData.updated_at);
                document.getElementById('updateInfo').textContent = 
                    `最終更新: ${updateTime.toLocaleString('ja-JP')}`;
                
                showTab(currentTab);
            } catch (error) {
                console.error('データ読み込みエラー:', error);
                document.getElementById('newsContainer').innerHTML = 
                    '<div class="no-news">ニュースデータの読み込みに失敗しました</div>';
            }
        }

        // タブを切り替える
        function showTab(tab) {
            currentTab = tab;
            
            // タブボタンのアクティブ状態を更新
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });
            event?.target?.classList.add('active');
            
            if (!newsData) return;
            
            let newsItems = [];
            
            if (tab === 'all') {
                newsItems = [
                    ...newsData.npb.map(n => ({...n, league: 'NPB'})),
                    ...newsData.jleague.map(n => ({...n, league: 'Jリーグ'})),
                    ...newsData.bleague.map(n => ({...n, league: 'Bリーグ'}))
                ];
            } else {
                newsItems = newsData[tab].map(n => ({
                    ...n, 
                    league: tab === 'npb' ? 'NPB' : tab === 'jleague' ? 'Jリーグ' : 'Bリーグ'
                }));
            }
            
            displayNews(newsItems);
        }

        // ニュースを表示する
        function displayNews(newsItems) {
            const container = document.getElementById('newsContainer');
            
            if (newsItems.length === 0) {
                container.innerHTML = '<div class="no-news">ニュースがありません</div>';
                return;
            }
            
            const html = `
                <div class="news-grid">
                    ${newsItems.map(item => `
                        <div class="news-card" onclick="window.open('${item.link}', '_blank')">
                            <div>
                                <span class="league-label">${item.league}</span>
                                <span class="team-badge">${item.team}</span>
                            </div>
                            <div class="news-title">${item.title}</div>
                            ${item.summary ? `<div class="news-summary">${item.summary}</div>` : ''}
                            <div class="news-meta">${item.published}</div>
                        </div>
                    `).join('')}
                </div>
            `;
            
            container.innerHTML = html;
        }

        // ページ読み込み時にニュースを取得
        loadNews();

        // 5分ごとに自動更新
        setInterval(loadNews, 5 * 60 * 1000);
    </script>
</body>
</html>
