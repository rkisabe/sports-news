name: Update Sports News

on:
  schedule:
    # 毎日 6:00, 12:00, 18:00, 22:00 JST (UTC +9)
    # UTC時刻で指定: 21:00, 03:00, 09:00, 13:00
    - cron: '0 21 * * *'  # 6:00 JST
    - cron: '0 3 * * *'   # 12:00 JST
    - cron: '0 9 * * *'   # 18:00 JST
    - cron: '0 13 * * *'  # 22:00 JST
  
  # 手動実行も可能にする
  workflow_dispatch:

# 権限設定を追加
permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 feedparser lxml
    
    - name: Run scraper
      run: |
        python scraper.py
      continue-on-error: false
    
    - name: Verify JSON file
      run: |
        if [ -f news_data.json ]; then
          echo "✅ news_data.json が作成されました"
          cat news_data.json | head -20
        else
          echo "❌ news_data.json が見つかりません"
          exit 1
        fi
    
    - name: Configure Git
      run: |
        git config --local user.name "GitHub Action"
        git config --local user.email "action@github.com"
    
    - name: Commit and push if changed
      run: |
        git add news_data.json
        if git diff --staged --quiet; then
          echo "変更がないためコミットをスキップします"
        else
          git commit -m "🔄 Update news data - $(date '+%Y-%m-%d %H:%M:%S JST')"
          git push
          echo "✅ 変更をプッシュしました"
        fi
