name: Update Sports News

on:
  schedule:
    # 毎日 6:00, 12:00, 18:00, 22:00 JST (UTC +9)
    # UTC時刻で指定: 21:00, 03:00, 09:00, 13:00
    - cron: '0 21 * * *'  # 6:00 JST
    - cron: '0 3 * * *'   # 12:00 JST
    - cron: '0 9 * * *'   # 18:00 JST
    - cron: '0 13 * * *'  # 22:00 JST
  
  # 手動実行も可能にする
  workflow_dispatch:

jobs:
  update-news:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install requests beautifulsoup4 feedparser lxml
    
    - name: Run scraper
      run: |
        python scraper.py
    
    - name: Commit and push if changed
      run: |
        git config --global user.name 'GitHub Action'
        git config --global user.email 'action@github.com'
        git add news_data.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update news data - $(date '+%Y-%m-%d %H:%M:%S')" && git push)
